name: Deploy to GitHub Pages

on:
  push:
    branches: [ "tgit04" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: 'tgit04'  # Garante o checkout da branch correta

      - name: Verify Files
        run: |
          if [ ! -d public/ ]; then
            echo "::error::❌ Pasta public/ não encontrada!"
            exit 1
          fi
          if [ ! -f public/index.html ]; then
            echo "::error::❌ index.html não encontrado em public/"
            exit 1
          fi

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: 'tgit04'

      - name: Configure Pages
        uses: actions/configure-pages@v4  # Versão mais recente

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3  # Versão atualizada
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4  # Versão mais recente