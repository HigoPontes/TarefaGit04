name: Deploy to GitHub Pages

on:
  push:
    branches: [ "tgit04" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if index.html exists
        run: |
          if [ ! -f public/index.html ]; then
            echo "❌ Error: index.html Não encontrado!"
            exit 1
          fi

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3  # Atualizado para v3 (ação específica para Pages)
        with:
          path: public/
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2